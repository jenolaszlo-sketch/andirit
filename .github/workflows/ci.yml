name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Andirit.slnx
      - run: dotnet format Andirit.slnx --verify-no-changes --no-restore
      - name: Test and coverage (core)
        run: >
          dotnet test tests/Andirit.Tests/Andirit.Tests.csproj
          -c Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Andirit]*%2c[Andirit.Abstractions]*'
          /p:Threshold=55
          /p:ThresholdType=line%2cbranch
      - name: Test and coverage (CSharp)
        run: >
          dotnet test tests/Andirit.CSharp.Tests/Andirit.CSharp.Tests.csproj
          -c Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-csharp/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Andirit.CSharp]*'
          /p:Threshold=75
          /p:ThresholdType=line%2cbranch
      - name: Test and coverage (TreeSitter)
        run: >
          dotnet test tests/Andirit.TreeSitter.Tests/Andirit.TreeSitter.Tests.csproj
          -c Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-treesitter/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Andirit.TreeSitter]*'
          /p:Threshold=60
          /p:ThresholdType=line%2cbranch
      - name: Test and coverage (LatticeDb)
        run: >
          dotnet test tests/Andirit.LatticeDb.Tests/Andirit.LatticeDb.Tests.csproj
          -c Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage-latticedb/
          /p:CoverletOutputFormat=cobertura
          '/p:Include=[Andirit.LatticeDb]*'
          /p:Threshold=70
          /p:ThresholdType=line%2cbranch
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-${{ matrix.os }}
          path: |
            coverage/
            coverage-csharp/
            coverage-treesitter/
            coverage-latticedb/
            **/TestResults/**/coverage.cobertura.xml

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Andirit.slnx
      - run: dotnet pack Andirit.slnx -c Release --no-restore --output artifacts/packages
      # Pack-consume-load smoke test for the Tree-sitter natives: repack with
      # a unique version (a same-version restore could resolve the published
      # previews instead of these bits), then consume the packages from a clean
      # project that proves the RID assets resolve and parse outside the repo
      # build output. Ubuntu stands in for all runners here; the test matrix
      # above proves native loading per OS.
      - name: Smoke-test all Andirit packages and Tree-sitter natives
        run: |
          SMOKE_VERSION="0.2.0-preview.6-smoke.${{ github.run_id }}"
          dotnet pack Andirit.slnx -c Release --no-restore --output "${{ github.workspace }}/smoke-packages" -p:Version="$SMOKE_VERSION"
          SMOKE_FEED="${{ github.workspace }}/smoke-packages" dotnet run --project smoke/TreeSitterPackage/TreeSitterPackage.csproj -c Release -p:SmokerPackageVersion="$SMOKE_VERSION"
