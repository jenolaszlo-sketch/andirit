name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate tag matches release version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <Version> from Directory.Build.props"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match release version $VERSION"; exit 1
            fi
            echo "Tag $GITHUB_REF_NAME matches release version $VERSION"
          else
            echo "Non-tag run ($GITHUB_REF_NAME); publishing at repository version $VERSION"
          fi

      - name: Pack
        shell: bash
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=("--property:PackageVersion=${GITHUB_REF_NAME#v}")
          fi
          for csproj in \
            src/Andirit.Abstractions/Andirit.Abstractions.csproj \
            src/Andirit/Andirit.csproj \
            src/Andirit.CSharp/Andirit.CSharp.csproj \
            src/Andirit.LatticeDb/Andirit.LatticeDb.csproj \
            src/Andirit.TreeSitter/Andirit.TreeSitter.csproj \
            src/Andirit.Testing/Andirit.Testing.csproj; do
            dotnet pack "$csproj" \
              --configuration Release \
              --output ./artifacts \
              "${args[@]}"
          done

      - name: Verify complete package inventory before publishing
        shell: bash
        run: |
          nupkg=$(ls -1 ./artifacts/*.nupkg 2>/dev/null | wc -l)
          snupkg=$(ls -1 ./artifacts/*.snupkg 2>/dev/null | wc -l)
          expected_ids="Andirit Andirit.Abstractions Andirit.CSharp Andirit.LatticeDb Andirit.Testing Andirit.TreeSitter"
          missing=""
          for id in $expected_ids; do
            ls ./artifacts/"$id".*.nupkg >/dev/null 2>&1 || missing="$missing $id"
          done
          if [ "$nupkg" -ne 6 ] || [ "$snupkg" -ne 6 ] || [ -n "$missing" ]; then
            echo "::error::Incomplete inventory: $nupkg nupkg, $snupkg snupkg; missing:$missing"; exit 1
          fi
          echo "Inventory complete: $nupkg nupkg and $snupkg snupkg"
          ls -1 ./artifacts/*.nupkg ./artifacts/*.snupkg

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Push symbols to NuGet
        run: >
          dotnet nuget push ./artifacts/*.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
